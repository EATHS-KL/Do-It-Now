<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DoItNow - AI Intelligent Execution Assistant</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:#15130F;
    --bg-soft:#1C1913;
    --card:#211D16;
    --card-hover:#292419;
    --border:#33301F;
    --text:#F3EFE6;
    --text-dim:#B8AF9C;
    --text-faint:#7C7566;
    --flame:#F2622B;
    --flame-soft:#3A2415;
    --flame-text:#FFB088;
    --teal:#3ECF9A;
    --teal-soft:#16302A;
    --amber:#E8B84B;
    --amber-soft:#332510;
    --danger:#E85D5D;
  }
  [data-theme="light"]{
    --bg:#FBF8F2;
    --bg-soft:#F3EEE3;
    --card:#FFFFFF;
    --card-hover:#F7F3EA;
    --border:#E7DFCC;
    --text:#241F17;
    --text-dim:#6B6353;
    --text-faint:#9C947F;
    --flame:#DD5A26;
    --flame-soft:#FBE2D2;
    --flame-text:#B8461A;
    --teal:#0F9D6D;
    --teal-soft:#DCF3E9;
    --amber:#B4841F;
    --amber-soft:#F7EBCE;
    --danger:#C6473F;
  }
  *{box-sizing:border-box;}
  html, body{ max-width:100%; overflow-x:hidden; }
  body{
    font-family:'Plus Jakarta Sans', sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  /* Native date/time inputs have a fixed intrinsic width on some mobile
     browsers, which forces flex parents to overflow. min-width:0 lets
     them shrink to fit their column instead of pushing the page wide. */
  input[type="date"], input[type="time"]{ min-width:0; width:100%; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; } }
  ::selection{ background:var(--flame-soft); color:var(--flame-text); }

  .card{ background:var(--card); border:1px solid var(--border); }
  .card:hover{ background:var(--card-hover); }
  .surface{ background:var(--bg-soft); border:1px solid var(--border); }
  .txt-dim{ color:var(--text-dim); }
  .txt-faint{ color:var(--text-faint); }

  .btn-flame{ background:var(--flame); color:#fff; }
  .btn-flame:hover{ filter:brightness(1.08); }
  .btn-flame:active{ transform:translateY(1px); }

  input, textarea, select{ background:var(--bg-soft); border:1px solid var(--border); color:var(--text); }
  input::placeholder, textarea::placeholder{ color:var(--text-faint); }
  input:focus, textarea:focus, select:focus{ outline:none; border-color:var(--flame); }
  input:focus-visible, textarea:focus-visible, button:focus-visible, select:focus-visible{
    outline:2px solid var(--flame); outline-offset:2px;
  }

  .chip{ border:1px solid var(--border); color:var(--text-dim); background:var(--bg-soft); }
  .chip:hover{ border-color:var(--flame); color:var(--flame-text); }
  .chip.active{ background:var(--flame-soft); border-color:var(--flame); color:var(--flame-text); }

  .tab{ color:var(--text-faint); border-bottom:2px solid transparent; }
  .tab.active{ color:var(--text); border-bottom-color:var(--flame); }

  .badge-shop{ background:var(--teal-soft); color:var(--teal); border:1px solid var(--teal); border-color:color-mix(in srgb, var(--teal) 40%, transparent); }
  .badge-task{ background:var(--flame-soft); color:var(--flame-text); border:1px solid color-mix(in srgb, var(--flame) 40%, transparent); }
  .badge-reminder{ background:var(--amber-soft); color:var(--amber); border:1px solid color-mix(in srgb, var(--amber) 40%, transparent); }

  @keyframes riseIn{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .rise{ animation:riseIn .25s ease-out; }

  .scrollbar-thin::-webkit-scrollbar{ height:6px; width:6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb{ background:var(--border); border-radius:99px; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<header class="border-b sticky top-0 z-40 backdrop-blur" style="border-color:var(--border); background:color-mix(in srgb, var(--bg) 85%, transparent);">
  <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="p-2 rounded-xl text-white btn-flame">
        <i data-lucide="zap" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-lg tracking-tight leading-none">DoItNow</h1>
        <p class="text-xs txt-faint mt-0.5">Think it. Set it. Do it.</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="toggleTheme()" id="themeBtn" aria-label="Toggle theme" class="chip p-2 rounded-xl transition">
        <i data-lucide="moon" class="w-4 h-4" id="themeIcon"></i>
      </button>
      <button onclick="requestNotificationPermission()" class="chip px-3 py-2 rounded-xl text-xs transition flex items-center space-x-1.5">
        <i data-lucide="bell" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">Alarms</span>
      </button>
      <button onclick="openSettings()" class="chip px-3 py-2 rounded-xl text-xs transition flex items-center space-x-1.5">
        <i data-lucide="key-round" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">API Key</span>
      </button>
    </div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-6 flex-1 w-full flex flex-col space-y-5">

  <!-- Compose -->
  <div class="card rounded-2xl p-4 space-y-3">
    <label for="thoughtInput" class="block text-sm font-medium">What's on your mind?</label>
    <textarea id="thoughtInput" rows="2" placeholder="e.g., Mujhe office ke liye ek acha perfume lena hai under 2000..." class="w-full rounded-xl p-3 text-sm resize-none"></textarea>

    <!-- Reminder settings -->
    <div class="surface rounded-xl p-3 space-y-2.5">
      <button onclick="toggleReminderPanel()" id="reminderToggleBtn" class="w-full flex items-center justify-between text-left gap-2 min-w-0">
        <span class="text-sm font-medium flex items-center gap-2 min-w-0">
          <i data-lucide="alarm-clock" class="w-4 h-4 shrink-0" style="color:var(--amber)"></i>
          <span class="shrink-0">Reminder</span>
          <span id="reminderSummary" class="text-xs txt-faint font-normal truncate"></span>
        </span>
        <i data-lucide="chevron-down" class="w-4 h-4 txt-faint transition-transform shrink-0" id="reminderChevron"></i>
      </button>

      <div id="reminderPanel" class="hidden space-y-2.5 pt-1">
        <div class="flex flex-wrap gap-2" id="quickChips">
          <button type="button" class="chip px-3 py-1.5 rounded-full text-xs transition" onclick="setQuickReminder('hour')">In 1 hour</button>
          <button type="button" class="chip px-3 py-1.5 rounded-full text-xs transition" onclick="setQuickReminder('tonight')">Tonight, 8 PM</button>
          <button type="button" class="chip px-3 py-1.5 rounded-full text-xs transition" onclick="setQuickReminder('tomorrow')">Tomorrow, 9 AM</button>
          <button type="button" class="chip px-3 py-1.5 rounded-full text-xs transition" onclick="testNotification()">Test notification</button>
          <button type="button" class="chip px-3 py-1.5 rounded-full text-xs transition" onclick="setQuickReminder('clear')">No reminder</button>
        </div>
        <div class="flex items-center gap-2 min-w-0">
          <div class="flex items-center gap-1.5 flex-1 min-w-0">
            <i data-lucide="calendar" class="w-4 h-4 txt-faint shrink-0"></i>
            <input type="date" id="alarmDateInput" onchange="onManualDateTimeChange()" class="min-w-0 w-full rounded-xl px-2 py-2 text-xs">
          </div>
          <div class="flex items-center gap-1.5 flex-1 min-w-0">
            <i data-lucide="clock" class="w-4 h-4 txt-faint shrink-0"></i>
            <input type="time" id="alarmTimeInput" onchange="onManualDateTimeChange()" class="min-w-0 w-full rounded-xl px-2 py-2 text-xs">
          </div>
        </div>
        <p id="reminderNote" class="text-xs txt-faint leading-snug"></p>
      </div>
    </div>

    <button onclick="processThought()" id="submitBtn" class="w-full font-medium px-6 py-2.5 rounded-xl transition flex items-center justify-center space-x-2 btn-flame">
      <i data-lucide="sparkles" class="w-4 h-4"></i>
      <span>Execute with AI</span>
    </button>
  </div>

  <!-- Board header -->
  <div class="flex items-center justify-between">
    <h2 class="font-semibold text-base">Your Action Board</h2>
    <span id="taskCount" class="text-xs surface px-2.5 py-1 rounded-full">0 items</span>
  </div>

  <!-- Filter tabs + search -->
  <div class="flex items-center justify-between gap-3">
    <div class="flex items-center gap-4 text-sm">
      <button class="tab pb-1" data-filter="all" onclick="setFilter('all')">All</button>
      <button class="tab pb-1" data-filter="pending" onclick="setFilter('pending')">Pending</button>
      <button class="tab pb-1" data-filter="done" onclick="setFilter('done')">Done</button>
    </div>
    <div class="relative flex-1 max-w-[160px]">
      <i data-lucide="search" class="w-3.5 h-3.5 absolute left-2.5 top-1/2 -translate-y-1/2 txt-faint"></i>
      <input type="text" id="searchInput" oninput="renderTasks()" placeholder="Search" class="w-full rounded-xl pl-8 pr-2 py-1.5 text-xs">
    </div>
  </div>

  <div id="taskList" class="space-y-3 pb-12">
    <div id="emptyState" class="text-center py-12 border border-dashed rounded-2xl" style="border-color:var(--border);">
      <i data-lucide="clipboard-list" class="w-10 h-10 mx-auto txt-faint mb-3"></i>
      <p class="txt-dim text-sm">Nothing here yet. Type a thought above and let AI action it.</p>
    </div>
  </div>

</main>

<!-- Settings Modal -->
<div id="settingsModal" class="fixed inset-0 backdrop-blur-sm hidden items-center justify-center z-50 p-4" style="background:color-mix(in srgb, var(--bg) 80%, transparent);">
  <div class="card rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl rise">
    <div class="flex items-center justify-between">
      <h3 class="text-lg font-bold">Gemini API Settings</h3>
      <button onclick="closeSettings()" class="txt-faint hover:opacity-80"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <p class="text-xs txt-faint">Enter your Google AI Studio API key. Saved only in this browser's local storage.</p>
    <div>
      <label class="block text-xs font-medium mb-1">API Key</label>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full rounded-xl p-3 text-sm">
    </div>
    <div class="flex justify-end space-x-3 pt-2">
      <button onclick="closeSettings()" class="chip px-4 py-2 rounded-xl text-sm">Cancel</button>
      <button onclick="saveApiKey()" class="px-4 py-2 rounded-xl text-sm font-medium btn-flame">Save Key</button>
    </div>
  </div>
</div>

<script>
  // ---------- Theme ----------
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('themeIcon').setAttribute('data-lucide', theme === 'light' ? 'sun' : 'moon');
    lucide.createIcons();
    localStorage.setItem('doitnow_theme', theme);
  }
  function toggleTheme(){
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(current === 'dark' ? 'light' : 'dark');
  }
  applyTheme(localStorage.getItem('doitnow_theme') || 'dark');
  lucide.createIcons();

  // ---------- State ----------
  let tasks = JSON.parse(localStorage.getItem('doitnow_tasks') || '[]');
  let currentFilter = 'all';
  renderTasks();
  checkStoredAlarms();
  updateReminderNote();

  // ---------- Reminder panel ----------
  function toggleReminderPanel(){
    const panel = document.getElementById('reminderPanel');
    const chevron = document.getElementById('reminderChevron');
    const isHidden = panel.classList.contains('hidden');
    panel.classList.toggle('hidden');
    chevron.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
  }

  function pad(n){ return n.toString().padStart(2,'0'); }

  function setDateTimeInputs(dateObj){
    document.getElementById('alarmDateInput').value =
      `${dateObj.getFullYear()}-${pad(dateObj.getMonth()+1)}-${pad(dateObj.getDate())}`;
    document.getElementById('alarmTimeInput').value =
      `${pad(dateObj.getHours())}:${pad(dateObj.getMinutes())}`;
    updateReminderSummary();
  }

  function setQuickReminder(kind){
    const now = new Date();
    if (kind === 'clear'){
      document.getElementById('alarmDateInput').value = '';
      document.getElementById('alarmTimeInput').value = '';
      updateReminderSummary();
      return;
    }
    let target = new Date(now);
    if (kind === 'hour'){
      target.setHours(target.getHours() + 1);
    } else if (kind === 'tonight'){
      target.setHours(20, 0, 0, 0);
      if (target <= now) target.setDate(target.getDate() + 1);
    } else if (kind === 'tomorrow'){
      target.setDate(target.getDate() + 1);
      target.setHours(9, 0, 0, 0);
    }
    setDateTimeInputs(target);
  }

  function onManualDateTimeChange(){ updateReminderSummary(); }

  function getAlarmTimestamp(){
    const d = document.getElementById('alarmDateInput').value;
    const t = document.getElementById('alarmTimeInput').value;
    if (!d || !t) return null;
    const ts = new Date(`${d}T${t}`).getTime();
    return isNaN(ts) ? null : ts;
  }

  function updateReminderSummary(){
    const ts = getAlarmTimestamp();
    const el = document.getElementById('reminderSummary');
    el.textContent = ts ? `· ${new Date(ts).toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'})}` : '';
    updateReminderNote();
  }

  function updateReminderNote(){
    const el = document.getElementById('reminderNote');
    if (!("Notification" in window) || Notification.permission !== "granted"){
      el.innerHTML = `Notifications aren't allowed yet — tap <b>Alarms</b> up top and allow them, otherwise this will only show an on-screen alert while the app is open.`;
    } else {
      el.innerHTML = `Notifications are on. This still only fires while this tab stays open — closing it, switching apps, or locking the phone before the time stops it, same as any website.`;
    }
  }

  // Fires a real notification 5s from now, independent of any task — use
  // this to check whether the notification pipeline itself works, without
  // needing to wait for a real reminder.
  function testNotification(){
    const fire = () => {
      setTimeout(() => {
        if (Notification.permission === "granted"){
          new Notification("DoItNow test", { body: "This is what your reminder will look like." });
        } else {
          alert("Test reminder (permission not granted, so this is an alert instead of a notification).");
        }
      }, 5000);
      alert("Test set for 5 seconds from now. Keep this tab open and watch for it.");
    };
    if (!("Notification" in window)) { alert("This browser doesn't support notifications."); return; }
    if (Notification.permission === "granted") { fire(); return; }
    Notification.requestPermission().then(() => { updateReminderNote(); fire(); });
  }

  // ---------- Filters ----------
  function setFilter(f){
    currentFilter = f;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.filter === f));
    renderTasks();
  }
  setFilter('all');

  // ---------- Settings ----------
  function requestNotificationPermission() {
    if (!("Notification" in window)) {
      alert("This browser does not support desktop notifications.");
    } else {
      Notification.requestPermission().then(permission => {
        alert(permission === "granted" ? "Alarms & notifications enabled." : "Permission denied for notifications.");
        updateReminderNote();
      });
    }
  }
  function openSettings() {
    document.getElementById('apiKeyInput').value = localStorage.getItem('gemini_api_key') || '';
    document.getElementById('settingsModal').classList.remove('hidden');
    document.getElementById('settingsModal').classList.add('flex');
  }
  function closeSettings() {
    document.getElementById('settingsModal').classList.remove('flex');
    document.getElementById('settingsModal').classList.add('hidden');
  }
  function saveApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (key) {
      localStorage.setItem('gemini_api_key', key);
      closeSettings();
    } else {
      alert('Please enter a valid API key.');
    }
  }

  // ---------- Core AI action ----------
  async function processThought() {
    const apiKey = localStorage.getItem('gemini_api_key');
    if (!apiKey) {
      alert('Please set your Gemini API key first using the API Key button on top.');
      openSettings();
      return;
    }

    const inputEl = document.getElementById('thoughtInput');
    const text = inputEl.value.trim();
    if (!text) return;

    const alarmTimestamp = getAlarmTimestamp();

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Processing AI...</span>`;
    lucide.createIcons();

    try {
      const prompt = `Analyze this raw user thought/task: "${text}".
      Determine if it requires shopping, a task breakdown, or a reminder.
      For shopping items, generate a direct Amazon search query URL component.
      Return ONLY a valid JSON object in this exact format, with no markdown code blocks around it:
      {
        "title": "Short crisp title of the task",
        "category": "Shopping / Task / Reminder",
        "summary": "1 line clear insight or recommendation",
        "actionText": "Direct action label (e.g. Search on Amazon, Start Task)",
        "searchQuery": "exact product keyword for amazon search"
      }`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      let cleanJsonStr = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
      const jsonStartIndex = cleanJsonStr.indexOf('{');
      const jsonEndIndex = cleanJsonStr.lastIndexOf('}');
      if (jsonStartIndex !== -1 && jsonEndIndex !== -1) {
        cleanJsonStr = cleanJsonStr.substring(jsonStartIndex, jsonEndIndex + 1);
      }

      const aiResult = JSON.parse(cleanJsonStr);

      const newTask = {
        id: Date.now(),
        raw: text,
        ai: aiResult,
        completed: false,
        createdAt: new Date().toLocaleDateString(),
        alarmTime: alarmTimestamp
      };

      tasks.unshift(newTask);
      localStorage.setItem('doitnow_tasks', JSON.stringify(tasks));
      inputEl.value = '';
      document.getElementById('alarmDateInput').value = '';
      document.getElementById('alarmTimeInput').value = '';
      updateReminderSummary();
      renderTasks();

      if (alarmTimestamp) {
        scheduleAlarm(newTask.id, aiResult.title, alarmTimestamp);
      }

    } catch (err) {
      alert('Error processing with Gemini API: ' + err.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4"></i><span>Execute with AI</span>`;
      lucide.createIcons();
    }
  }

  // ---------- Alarms ----------
  function scheduleAlarm(id, title, targetTimestamp) {
    const delayMs = targetTimestamp - Date.now();
    if (delayMs <= 0) {
      // Time already reached (or was set for "now") — notify right away
      // instead of silently doing nothing.
      triggerAlarmNotification(id, title, { missed: true });
      return;
    }
    setTimeout(() => { triggerAlarmNotification(id, title); }, delayMs);
  }
  function checkStoredAlarms() {
    const now = Date.now();
    tasks.forEach(t => {
      if (!t.alarmTime || t.completed || t.notified) return;
      if (t.alarmTime > now) {
        scheduleAlarm(t.id, t.ai.title, t.alarmTime);
      } else {
        // Reminder time already passed while the app was closed — catch it
        // up as soon as the page is reopened, instead of staying silent.
        triggerAlarmNotification(t.id, t.ai.title, { missed: true });
      }
    });
  }
  function triggerAlarmNotification(id, title, opts) {
    const task = tasks.find(t => t.id === id);
    if (task && !task.completed && !task.notified) {
      const prefix = opts && opts.missed ? "Missed reminder" : "DoItNow Reminder";
      if (Notification.permission === "granted") {
        new Notification(prefix, { body: `Time to check: ${title}` });
      } else {
        alert(`${prefix}: Time to check "${title}"!`);
      }
      task.notified = true;
      localStorage.setItem('doitnow_tasks', JSON.stringify(tasks));
      renderTasks();
    }
  }

  // ---------- Amazon open (fixed-width button, no layout jump) ----------
  function openAmazon(btn, url) {
    if (btn.dataset.busy) return; // ignore double-tap
    // Open first, synchronously, inside the click gesture — this is what
    // keeps mobile browsers from blocking the popup and avoids any delay
    // before the tab switches.
    window.open(url, '_blank');
    btn.dataset.busy = '1';
    btn.querySelector('.state-default').style.display = 'none';
    btn.querySelector('.state-opened').style.display = 'inline-flex';
    setTimeout(() => {
      btn.querySelector('.state-default').style.display = 'inline-flex';
      btn.querySelector('.state-opened').style.display = 'none';
      delete btn.dataset.busy;
    }, 900);
  }

  // ---------- Task actions ----------
  function toggleTask(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
    localStorage.setItem('doitnow_tasks', JSON.stringify(tasks));
    renderTasks();
  }
  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    localStorage.setItem('doitnow_tasks', JSON.stringify(tasks));
    renderTasks();
  }

  // ---------- Render ----------
  function renderTasks() {
    const listEl = document.getElementById('taskList');
    const countEl = document.getElementById('taskCount');
    const search = (document.getElementById('searchInput')?.value || '').toLowerCase();

    let visible = tasks.filter(t => {
      if (currentFilter === 'pending' && t.completed) return false;
      if (currentFilter === 'done' && !t.completed) return false;
      if (search && !(`${t.ai.title} ${t.raw}`.toLowerCase().includes(search))) return false;
      return true;
    });

    countEl.innerText = `${tasks.length} item${tasks.length === 1 ? '' : 's'}`;

    if (visible.length === 0) {
      listEl.innerHTML = `
        <div id="emptyState" class="text-center py-12 border border-dashed rounded-2xl" style="border-color:var(--border);">
          <i data-lucide="clipboard-list" class="w-10 h-10 mx-auto txt-faint mb-3"></i>
          <p class="txt-dim text-sm">${tasks.length === 0 ? 'Nothing here yet. Type a thought above and let AI action it.' : 'No items match this view.'}</p>
        </div>`;
      lucide.createIcons();
      return;
    }

    const badgeClass = (cat) => cat === 'Shopping' ? 'badge-shop' : (cat === 'Reminder' ? 'badge-reminder' : 'badge-task');

    listEl.innerHTML = visible.map(t => {
      const amazonUrl = `https://www.amazon.in/s?k=${encodeURIComponent(t.ai.searchQuery || t.ai.title)}`;
      const formattedAlarm = t.alarmTime ? new Date(t.alarmTime).toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'}) : '';
      const showAmazon = t.ai.category === 'Shopping';
      return `
        <div class="card rounded-2xl p-4 transition flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 rise ${t.completed ? 'opacity-60' : ''}">
          <div class="flex items-start space-x-3 flex-1 min-w-0">
            <input type="checkbox" ${t.completed ? 'checked' : ''} onclick="toggleTask(${t.id})" aria-label="Mark done" class="mt-1 w-5 h-5 rounded cursor-pointer" style="accent-color:var(--flame)">
            <div class="min-w-0">
              <div class="flex items-center flex-wrap gap-1.5">
                <span class="text-xs px-2 py-0.5 rounded-full font-medium ${badgeClass(t.ai.category)}">${t.ai.category}</span>
                <span class="text-xs txt-faint">${t.createdAt}</span>
                ${t.alarmTime ? `<span class="text-xs badge-reminder px-2 py-0.5 rounded-full flex items-center gap-1"><i data-lucide="bell" class="w-3 h-3"></i>${formattedAlarm}</span>` : ''}
              </div>
              <h3 class="font-semibold text-base mt-1 ${t.completed ? 'line-through txt-faint' : ''}">${t.ai.title}</h3>
              <p class="text-sm txt-dim mt-0.5">${t.ai.summary}</p>
              <p class="text-xs txt-faint mt-1 italic truncate">"${t.raw}"</p>
            </div>
          </div>
          <div class="flex items-center space-x-2 self-end sm:self-center w-full sm:w-auto justify-end shrink-0">
            ${showAmazon ? `<button type="button" onclick="openAmazon(this, '${amazonUrl.replace(/'/g, "\\'")}')" class="chip px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1 relative" style="min-width:96px;">
              <span class="state-default" style="display:inline-flex; align-items:center; gap:4px;"><i data-lucide="external-link" class="w-3.5 h-3.5"></i><span>Amazon</span></span>
              <span class="state-opened" style="display:none; align-items:center; gap:4px; color:var(--teal);"><i data-lucide="check" class="w-3.5 h-3.5"></i><span>Opened</span></span>
            </button>` : ''}
            <button onclick="deleteTask(${t.id})" aria-label="Delete" class="txt-faint hover:opacity-80 p-2 transition" style="color:var(--danger);">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        </div>`;
    }).join('');

    lucide.createIcons();
  }
</script>
</body>
</html>
